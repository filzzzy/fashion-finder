[project]
name = "fashion-finder"
version = "0.1.0"
description = "Photo Search by Text Hint — Composed Image Retrieval over fashion catalogues"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Elizaveta Finenko", email = "finenko.ea@phystech.edu" }]
license = { text = "MIT" }

dependencies = [
    "torch>=2.2,<2.4",
    "torchvision>=0.17,<0.19",
    "pytorch-lightning>=2.2",
    "transformers>=4.41,<5",
    "peft>=0.10",
    "timm>=1.0.7",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "fire>=0.6",
    "mlflow>=2.13",
    "dvc>=3.50",
    "faiss-cpu>=1.8",
    "pillow>=10.3",
    "tqdm>=4.66",
    "numpy>=1.26,<2.0",
    "datasets>=2.19",
    "huggingface-hub>=0.23",
    "requests>=2.32",
    "gitpython>=3.1",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "tensorboardx>=2.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
]
serving = [
    "tritonclient[http]>=2.46",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[project.scripts]
fashion-finder = "fashion_finder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fashion_finder"]

# ---------- Ruff (replaces black + isort + flake8) ----------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["outputs", "multirun", "mlruns", ".dvc"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PTH", # use pathlib
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # function calls in default args (common in hydra)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q --strict-markers"
